name: Build APK Confiável
on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # A chave de assinatura fica em cache: assim todas as versões usam a mesma
      # assinatura e o app pode ser atualizado sem desinstalar.
      - name: Restaurar chave de assinatura
        uses: actions/cache@v4
        with:
          path: |
            app/release-key.jks
            app/release-key.pass
          key: autoclicker-keystore-v1

      - name: Criar projeto Android Seguro e Confiável
        run: |
          mkdir -p app/src/main/java/com/meu/autoclicker app/src/main/res/xml app/src/main/res/values

          # Senha aleatória (nada de senha fixa no código) + keystore gerado só uma vez
          if [ ! -f app/release-key.jks ] || [ ! -f app/release-key.pass ]; then
            rm -f app/release-key.jks
            openssl rand -hex 16 > app/release-key.pass
            keytool -genkey -keystore app/release-key.jks -keyalg RSA -keysize 2048 -validity 10000 \
              -alias autoclicker_alias -storepass "$(cat app/release-key.pass)" -keypass "$(cat app/release-key.pass)" \
              -dname "CN=AutoClicker Pro, OU=Development, O=Trusted, L=Brasil, ST=SP, C=BR"
          fi
          echo "KS_PASS=$(cat app/release-key.pass)" >> "$GITHUB_ENV"

          cat > settings.gradle.kts <<'KT_EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "AutoClickerPro"
          include(":app")
          KT_EOF

          cat > build.gradle.kts <<'KT_EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          KT_EOF

          cat > gradle.properties <<'KT_EOF'
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          android.useAndroidX=false
          android.nonTransitiveRClass=true
          KT_EOF

          cat > app/proguard-rules.pro <<'KT_EOF'
          -keep class com.meu.autoclicker.** { *; }
          -dontwarn com.meu.autoclicker.**
          KT_EOF

          cat > app/build.gradle.kts <<'KT_EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.meu.autoclicker"
              compileSdk = 34

              signingConfigs {
                  create("release") {
                      storeFile = file("release-key.jks")
                      storePassword = System.getenv("KS_PASS")
                      keyAlias = "autoclicker_alias"
                      keyPassword = System.getenv("KS_PASS")
                  }
              }

              defaultConfig {
                  applicationId = "com.meu.autoclicker"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 4
                  versionName = "2.2"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = true
                      proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")
                      signingConfig = signingConfigs.getByName("release")
                  }
              }

              lint {
                  abortOnError = false
                  checkReleaseBuilds = false
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          KT_EOF

          cat > app/src/main/AndroidManifest.xml <<'KT_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.VIBRATE" />

              <application
                  android:allowBackup="false"
                  android:icon="@android:drawable/ic_menu_compass"
                  android:label="Auto Clicker Pro"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <activity
                      android:name=".SettingsActivity"
                      android:exported="false"
                      android:theme="@android:style/Theme.DeviceDefault.NoActionBar" />

                  <activity
                      android:name=".ClickConfigActivity"
                      android:exported="false"
                      android:excludeFromRecents="true"
                      android:taskAffinity=""
                      android:theme="@android:style/Theme.DeviceDefault.Dialog" />

                  <service
                      android:name=".ClickService"
                      android:exported="true"
                      android:label="Auto Clicker Pro"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_config" />
                  </service>
              </application>
          </manifest>
          KT_EOF

          cat > app/src/main/res/xml/accessibility_config.xml <<'KT_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagDefault"
              android:canPerformGestures="true"
              android:canRetrieveWindowContent="false"
              android:description="@string/service_desc"
              android:notificationTimeout="100" />
          KT_EOF

          cat > app/src/main/res/values/strings.xml <<'KT_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="service_desc">Executa toques e deslizes automáticos. Não lê o conteúdo da tela, não acessa a internet e possui parada de emergência, limite de tempo e bloqueio de apps sensíveis.</string>
          </resources>
          KT_EOF

          cat > app/src/main/java/com/meu/autoclicker/Prefs.kt <<'KT_EOF'
          package com.meu.autoclicker

          import android.content.Context

          object Prefs {

              class Field(
                  val key: String,
                  val label: String,
                  val def: Long,
                  val desc: String,
                  val unit: String,
                  val min: Long,
                  val max: Long
              )

              val fields = listOf(
                  Field("interval", "Intervalo entre toques", 500L, "Tempo de espera entre um toque e o próximo.", "ms", 10L, 600000L),
                  Field("random", "Variação aleatória do intervalo", 0L, "Soma ou subtrai um tempo aleatório do intervalo.", "± ms", 0L, 60000L),
                  Field("tapDur", "Duração do toque", 50L, "Quanto tempo o toque fica pressionado na tela.", "ms", 1L, 10000L),
                  Field("swipeDur", "Duração do deslize", 400L, "Tempo que o deslize leva do ponto A até o ponto B.", "ms", 1L, 10000L),
                  Field("startDelay", "Atraso antes de começar", 1000L, "Espera antes do primeiro toque, para você se preparar.", "ms", 0L, 60000L),
                  Field("jitter", "Variação de posição", 0L, "Muda o ponto do toque alguns pixels, para parecer mais natural.", "px", 0L, 200L),
                  Field("repeats", "Repetições do ciclo", 0L, "Quantas vezes repetir todos os pontos. Use 0 para repetir sem parar.", "vezes", 0L, 1000000L),
                  Field("maxMinutes", "Tempo máximo de execução", 30L, "Para sozinho depois desse tempo. Use 0 para não limitar.", "min", 0L, 1440L),
                  Field("safeMode", "Modo seguro", 1L, "", "", 0L, 1L),
                  Field("vibrate", "Vibração", 1L, "", "", 0L, 1L),
                  Field("theme", "Tema", 0L, "", "", 0L, 1L),
                  Field("panelScale", "Tamanho do painel", 100L, "", "%", 60L, 150L),
                  Field("panelAlpha", "Transparência do painel", 95L, "", "%", 30L, 100L),
                  Field("panelColor", "Cor do painel", 0L, "", "", 0L, 4L)
              )

              private val noProfile = setOf("theme")

              fun find(key: String): Field? = fields.firstOrNull { it.key == key }

              private fun sp(c: Context) = c.getSharedPreferences("cfg", Context.MODE_PRIVATE)

              fun get(c: Context, key: String): Long = sp(c).getLong(key, find(key)?.def ?: 0L)

              fun set(c: Context, key: String, v: Long) {
                  val f = find(key)
                  val value = if (f != null) v.coerceIn(f.min, f.max) else v
                  sp(c).edit().putLong(key, value).apply()
              }

              fun getRaw(c: Context, key: String, def: Long): Long = sp(c).getLong(key, def)

              fun setRaw(c: Context, key: String, v: Long) {
                  sp(c).edit().putLong(key, v).apply()
              }

              // ---- Perfis (3 espaços para salvar configurações)
              private fun prof(c: Context, slot: Int) = c.getSharedPreferences("profile" + slot, Context.MODE_PRIVATE)

              fun hasProfile(c: Context, slot: Int): Boolean = prof(c, slot).contains("_saved")

              fun profileTime(c: Context, slot: Int): Long = prof(c, slot).getLong("_saved", 0L)

              fun saveProfile(c: Context, slot: Int) {
                  val e = prof(c, slot).edit()
                  for (f in fields) {
                      if (f.key in noProfile) continue
                      e.putLong(f.key, get(c, f.key))
                  }
                  e.putLong("_saved", System.currentTimeMillis())
                  e.apply()
              }

              fun loadProfile(c: Context, slot: Int) {
                  val s = prof(c, slot)
                  for (f in fields) {
                      if (f.key in noProfile) continue
                      set(c, f.key, s.getLong(f.key, f.def))
                  }
              }

              fun resetAll(c: Context) {
                  for (f in fields) {
                      if (f.key in noProfile) continue
                      set(c, f.key, f.def)
                  }
                  setRaw(c, "panelX", -1L)
                  setRaw(c, "panelY", -1L)
              }
          }
          KT_EOF

          cat > app/src/main/java/com/meu/autoclicker/MainActivity.kt <<'KT_EOF'
          package com.meu.autoclicker

          import android.animation.ObjectAnimator
          import android.animation.PropertyValuesHolder
          import android.animation.ValueAnimator
          import android.app.Activity
          import android.app.AlertDialog
          import android.content.Intent
          import android.graphics.Color
          import android.graphics.drawable.GradientDrawable
          import android.net.Uri
          import android.os.Bundle
          import android.provider.Settings
          import android.view.Gravity
          import android.view.View
          import android.view.animation.DecelerateInterpolator
          import android.widget.FrameLayout
          import android.widget.LinearLayout
          import android.widget.TextView

          class MainActivity : Activity() {

              private lateinit var p: Ui.Pal
              private var accent = 0
              private lateinit var glow: View
              private lateinit var mainIcon: TextView
              private lateinit var mainLabel: TextView
              private lateinit var hint: TextView
              private var pulse: ObjectAnimator? = null

              private fun dp(v: Int) = Ui.dp(this, v)

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  p = Ui.pal(this)
                  accent = Ui.accent(this)
                  Ui.systemBars(this)

                  val root = FrameLayout(this)
                  root.setBackgroundColor(p.bg)

                  val center = LinearLayout(this)
                  center.orientation = LinearLayout.VERTICAL
                  center.gravity = Gravity.CENTER_HORIZONTAL

                  val box = FrameLayout(this)

                  glow = View(this)
                  val gg = GradientDrawable()
                  gg.shape = GradientDrawable.OVAL
                  gg.setColor(accent)
                  glow.background = gg
                  glow.alpha = 0f
                  box.addView(glow, FrameLayout.LayoutParams(dp(190), dp(190), Gravity.CENTER))

                  val btn = LinearLayout(this)
                  btn.orientation = LinearLayout.VERTICAL
                  btn.gravity = Gravity.CENTER
                  val bg = GradientDrawable(GradientDrawable.Orientation.TL_BR, intArrayOf(accent, Ui.darken(accent, 0.6f)))
                  bg.shape = GradientDrawable.OVAL
                  btn.background = bg
                  btn.elevation = dp(10).toFloat()
                  mainIcon = Ui.text(this, "▶", 52f, Color.WHITE, true)
                  mainIcon.gravity = Gravity.CENTER
                  mainLabel = Ui.text(this, "Abrir painel", 15f, Color.WHITE, true)
                  mainLabel.gravity = Gravity.CENTER
                  btn.addView(mainIcon)
                  btn.addView(mainLabel)
                  btn.setOnClickListener { onMain() }
                  Ui.press(btn)
                  box.addView(btn, FrameLayout.LayoutParams(dp(190), dp(190), Gravity.CENTER))
                  center.addView(box, LinearLayout.LayoutParams(dp(260), dp(260)))

                  hint = Ui.text(this, "", 13f, p.muted)
                  hint.gravity = Gravity.CENTER
                  hint.setPadding(dp(24), dp(10), dp(24), 0)
                  center.addView(hint)

                  root.addView(
                      center,
                      FrameLayout.LayoutParams(
                          FrameLayout.LayoutParams.MATCH_PARENT,
                          FrameLayout.LayoutParams.WRAP_CONTENT,
                          Gravity.CENTER
                      )
                  )

                  val gear = Ui.text(this, "⚙", 24f, p.text)
                  gear.gravity = Gravity.CENTER
                  gear.contentDescription = "Configurações"
                  gear.background = Ui.rounded(this, p.card, 16, 1, p.stroke)
                  val glp = FrameLayout.LayoutParams(dp(50), dp(50), Gravity.TOP or Gravity.END)
                  glp.setMargins(0, dp(40), dp(18), 0)
                  gear.setOnClickListener { startActivity(Intent(this, SettingsActivity::class.java)) }
                  Ui.press(gear)
                  root.addView(gear, glp)

                  setContentView(root)
                  Ui.appear(center)
              }

              private fun onMain() {
                  val s = ClickService.instance
                  if (s == null) {
                      askAccessibility()
                      return
                  }
                  if (s.isPanelOpen()) {
                      s.closePanelFromUi()
                      refresh()
                  } else {
                      s.showPanel()
                      moveTaskToBack(true)
                  }
              }

              private fun askAccessibility() {
                  val theme = if (p.light) android.R.style.Theme_DeviceDefault_Light_Dialog_Alert
                  else android.R.style.Theme_DeviceDefault_Dialog_Alert
                  AlertDialog.Builder(this, theme)
                      .setTitle("Ative a acessibilidade")
                      .setMessage(
                          "Para tocar na tela por você, o app precisa do serviço de acessibilidade.\n\n" +
                              "Toque em Abrir configurações, escolha Auto Clicker Pro e ative.\n\n" +
                              "Se o Android bloquear, abra Informações do app e permita as configurações restritas."
                      )
                      .setPositiveButton("Abrir configurações") { _, _ ->
                          startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))
                      }
                      .setNeutralButton("Informações do app") { _, _ ->
                          val i = Intent(Settings.ACTION_APPLICATION_DETAILS_SETTINGS)
                          i.data = Uri.parse("package:" + packageName)
                          startActivity(i)
                      }
                      .setNegativeButton("Agora não", null)
                      .show()
              }

              private fun refresh() {
                  val s = ClickService.instance
                  if (s == null) {
                      mainIcon.text = "▶"
                      mainLabel.text = "Abrir painel"
                      hint.text = "Ative o serviço de acessibilidade para usar"
                      hint.setTextColor(p.red)
                  } else if (s.isPanelOpen()) {
                      mainIcon.text = "■"
                      mainLabel.text = "Fechar painel"
                      hint.text = "Painel aberto"
                      hint.setTextColor(p.green)
                  } else {
                      mainIcon.text = "▶"
                      mainLabel.text = "Abrir painel"
                      hint.text = ""
                  }
              }

              private fun startPulse() {
                  stopPulse()
                  val a = ObjectAnimator.ofPropertyValuesHolder(
                      glow,
                      PropertyValuesHolder.ofFloat("scaleX", 1f, 1.3f),
                      PropertyValuesHolder.ofFloat("scaleY", 1f, 1.3f),
                      PropertyValuesHolder.ofFloat("alpha", 0.45f, 0f)
                  )
                  a.duration = 2000L
                  a.repeatCount = ValueAnimator.INFINITE
                  a.interpolator = DecelerateInterpolator()
                  a.start()
                  pulse = a
              }

              private fun stopPulse() {
                  pulse?.cancel()
                  pulse = null
                  glow.alpha = 0f
              }

              override fun onResume() {
                  super.onResume()
                  if (Ui.pal(this) !== p || Ui.accent(this) != accent) {
                      recreate()
                      return
                  }
                  refresh()
                  startPulse()
              }

              override fun onPause() {
                  stopPulse()
                  super.onPause()
              }
          }
          KT_EOF

          cat > app/src/main/java/com/meu/autoclicker/ClickConfigActivity.kt <<'KT_EOF'
          package com.meu.autoclicker

          import android.app.Activity
          import android.graphics.Color
          import android.graphics.drawable.ColorDrawable
          import android.os.Bundle
          import android.text.InputFilter
          import android.text.InputType
          import android.view.Gravity
          import android.view.ViewGroup
          import android.view.WindowManager
          import android.widget.EditText
          import android.widget.LinearLayout
          import android.widget.ScrollView

          class ClickConfigActivity : Activity() {

              private fun dp(v: Int) = Ui.dp(this, v)

              private fun field(p: Ui.Pal, value: Long, maxLen: Int): EditText {
                  val et = EditText(this)
                  et.inputType = InputType.TYPE_CLASS_NUMBER
                  et.filters = arrayOf<InputFilter>(InputFilter.LengthFilter(maxLen))
                  et.setText(value.toString())
                  et.setTextColor(p.text)
                  et.textSize = 16f
                  et.gravity = Gravity.CENTER
                  et.background = Ui.rounded(this, p.field, 10, 1, p.stroke)
                  et.setPadding(dp(4), dp(10), dp(4), dp(10))
                  et.setSelectAllOnFocus(true)
                  return et
              }

              private fun column(p: Ui.Pal, label: String, et: EditText): LinearLayout {
                  val c = LinearLayout(this)
                  c.orientation = LinearLayout.VERTICAL
                  val lp = LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f)
                  lp.setMargins(dp(3), 0, dp(3), 0)
                  c.layoutParams = lp
                  val l = Ui.text(this, label, 11f, p.muted)
                  l.gravity = Gravity.CENTER
                  l.setPadding(0, 0, 0, dp(4))
                  c.addView(l)
                  c.addView(et)
                  return c
              }

              private fun num(e: EditText): Long = e.text.toString().toLongOrNull() ?: 0L

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  window.setBackgroundDrawable(ColorDrawable(Color.TRANSPARENT))
                  window.setSoftInputMode(WindowManager.LayoutParams.SOFT_INPUT_ADJUST_RESIZE)
                  window.setLayout((resources.displayMetrics.widthPixels * 0.94).toInt(), ViewGroup.LayoutParams.WRAP_CONTENT)

                  val p = Ui.pal(this)
                  val accent = Ui.accent(this)

                  val svc = ClickService.instance
                  val index = intent.getIntExtra("index", -1)
                  val info = svc?.getActInfo(index)
                  if (svc == null || info == null) {
                      finish()
                      return
                  }

                  val delay = info[0]
                  val dur = info[1]
                  val swipe = info[2] == 1L
                  val shownDelay = if (delay >= 0) delay else Prefs.get(this, "interval")
                  val shownDur = if (dur > 0) dur else if (swipe) Prefs.get(this, "swipeDur") else Prefs.get(this, "tapDur")

                  val card = LinearLayout(this)
                  card.orientation = LinearLayout.VERTICAL
                  card.background = Ui.rounded(this, p.card, 18, 1, p.stroke)
                  card.setPadding(dp(16), dp(16), dp(16), dp(18))

                  card.addView(Ui.text(this, "Botão " + (index + 1), 20f, p.text, true))

                  val l1 = Ui.text(this, "ATRASO ATÉ O PRÓXIMO BOTÃO", 11f, p.muted, true)
                  l1.setPadding(0, dp(16), 0, dp(2))
                  card.addView(l1)
                  card.addView(Ui.text(this, "Tempo de espera depois deste botão, antes de apertar o próximo.", 12f, p.muted))

                  val fH = field(p, shownDelay / 3600000L, 2)
                  val fM = field(p, (shownDelay % 3600000L) / 60000L, 2)
                  val fS = field(p, (shownDelay % 60000L) / 1000L, 2)
                  val fMs = field(p, shownDelay % 1000L, 3)

                  val row = LinearLayout(this)
                  row.orientation = LinearLayout.HORIZONTAL
                  row.layoutParams = Ui.lp(this, 10, 0)
                  row.addView(column(p, "Horas", fH))
                  row.addView(column(p, "Minutos", fM))
                  row.addView(column(p, "Segundos", fS))
                  row.addView(column(p, "Milésimos", fMs))
                  card.addView(row)

                  val l2 = Ui.text(this, if (swipe) "DURAÇÃO DO DESLIZE (ms)" else "DURAÇÃO DO TOQUE (ms)", 11f, p.muted, true)
                  l2.setPadding(0, dp(18), 0, dp(6))
                  card.addView(l2)
                  val fDur = field(p, shownDur, 5)
                  card.addView(fDur)

                  card.addView(Ui.button(this, "Salvar", accent, Color.WHITE) {
                      val total = (num(fH) * 3600000L + num(fM) * 60000L + num(fS) * 1000L + num(fMs))
                          .coerceIn(10L, 360000000L)
                      val d = num(fDur).coerceIn(1L, 60000L)
                      svc.setActCustom(index, total, d)
                      finish()
                  })
                  card.addView(Ui.button(this, "Usar padrão das configurações", p.field, p.text) {
                      svc.setActCustom(index, -1L, -1L)
                      finish()
                  })
                  card.addView(Ui.button(this, "Cancelar", p.field, p.muted) { finish() })

                  val scroll = ScrollView(this)
                  scroll.addView(card)
                  setContentView(scroll)
              }
          }
          KT_EOF

          cat > app/src/main/java/com/meu/autoclicker/Ui.kt <<'KT_EOF'
          package com.meu.autoclicker

          import android.app.Activity
          import android.content.Context
          import android.graphics.Color
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.os.Build
          import android.view.MotionEvent
          import android.view.View
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.TextView

          object Ui {

              class Pal(
                  val bg: Int,
                  val card: Int,
                  val stroke: Int,
                  val green: Int,
                  val red: Int,
                  val text: Int,
                  val muted: Int,
                  val field: Int,
                  val light: Boolean
              )

              private val dark = Pal(
                  Color.parseColor("#0E1116"), Color.parseColor("#171B22"), Color.parseColor("#262C36"),
                  Color.parseColor("#3DDC84"), Color.parseColor("#FF5C5C"),
                  Color.parseColor("#ECEFF4"), Color.parseColor("#8B95A5"), Color.parseColor("#0E1116"), false
              )

              private val light = Pal(
                  Color.parseColor("#F4F6FA"), Color.parseColor("#FFFFFF"), Color.parseColor("#E1E5EC"),
                  Color.parseColor("#1FA85A"), Color.parseColor("#D93636"),
                  Color.parseColor("#171B22"), Color.parseColor("#6B7585"), Color.parseColor("#F0F2F7"), true
              )

              val accents = intArrayOf(
                  Color.parseColor("#4C8DFF"),
                  Color.parseColor("#3DDC84"),
                  Color.parseColor("#B388FF"),
                  Color.parseColor("#FFA94D"),
                  Color.parseColor("#FF6EA8")
              )

              fun pal(c: Context): Pal = if (Prefs.get(c, "theme") == 1L) light else dark

              fun accent(c: Context): Int = accents[Prefs.get(c, "panelColor").toInt().coerceIn(0, accents.size - 1)]

              fun darken(color: Int, f: Float): Int =
                  Color.rgb((Color.red(color) * f).toInt(), (Color.green(color) * f).toInt(), (Color.blue(color) * f).toInt())

              fun dp(c: Context, v: Int): Int = (v * c.resources.displayMetrics.density).toInt()

              fun rounded(c: Context, color: Int, radius: Int, strokeW: Int = 0, strokeC: Int = 0): GradientDrawable {
                  val g = GradientDrawable()
                  g.setColor(color)
                  g.cornerRadius = dp(c, radius).toFloat()
                  if (strokeW > 0) g.setStroke(dp(c, strokeW), strokeC)
                  return g
              }

              fun text(c: Context, t: String, size: Float, color: Int, bold: Boolean = false): TextView {
                  val v = TextView(c)
                  v.text = t
                  v.textSize = size
                  v.setTextColor(color)
                  if (bold) v.typeface = Typeface.DEFAULT_BOLD
                  return v
              }

              fun lp(c: Context, top: Int = 0, bottom: Int = 0): LinearLayout.LayoutParams {
                  val l = LinearLayout.LayoutParams(
                      LinearLayout.LayoutParams.MATCH_PARENT,
                      LinearLayout.LayoutParams.WRAP_CONTENT
                  )
                  l.setMargins(0, dp(c, top), 0, dp(c, bottom))
                  return l
              }

              // Efeito suave de "apertar" ao tocar
              fun press(v: View) {
                  v.setOnTouchListener { view, e ->
                      when (e.action) {
                          MotionEvent.ACTION_DOWN -> view.animate().scaleX(0.96f).scaleY(0.96f).setDuration(80).start()
                          MotionEvent.ACTION_UP, MotionEvent.ACTION_CANCEL -> view.animate().scaleX(1f).scaleY(1f).setDuration(120).start()
                      }
                      false
                  }
              }

              fun button(c: Context, t: String, bg: Int, fg: Int, onClick: () -> Unit): Button {
                  val b = Button(c)
                  b.text = t
                  b.isAllCaps = false
                  b.textSize = 15f
                  b.typeface = Typeface.DEFAULT_BOLD
                  b.setTextColor(fg)
                  b.background = rounded(c, bg, 14)
                  b.stateListAnimator = null
                  b.layoutParams = lp(c, 10, 0)
                  b.setOnClickListener { onClick() }
                  press(b)
                  return b
              }

              fun card(c: Context): LinearLayout {
                  val p = pal(c)
                  val l = LinearLayout(c)
                  l.orientation = LinearLayout.VERTICAL
                  l.background = rounded(c, p.card, 16, 1, p.stroke)
                  l.setPadding(dp(c, 16), dp(c, 14), dp(c, 16), dp(c, 16))
                  l.layoutParams = lp(c, 0, 12)
                  return l
              }

              fun appear(v: View) {
                  v.alpha = 0f
                  v.translationY = 24f
                  v.animate().alpha(1f).translationY(0f).setDuration(220).start()
              }

              fun systemBars(a: Activity) {
                  val p = pal(a)
                  a.window.statusBarColor = p.bg
                  a.window.navigationBarColor = p.bg
                  var flags = 0
                  if (p.light) {
                      flags = View.SYSTEM_UI_FLAG_LIGHT_STATUS_BAR
                      if (Build.VERSION.SDK_INT >= 26) flags = flags or View.SYSTEM_UI_FLAG_LIGHT_NAVIGATION_BAR
                  }
                  a.window.decorView.systemUiVisibility = flags
              }
          }
