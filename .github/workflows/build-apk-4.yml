          import kotlin.random.Random

          class ClickService : AccessibilityService(), SensorEventListener {

              companion object {
                  @Volatile
                  var instance: ClickService? = null

                  // Apps onde o auto clicker nunca deve rodar no modo seguro
                  private val BLOCKED = setOf(
                      "com.android.settings",
                      "com.android.packageinstaller",
                      "com.google.android.packageinstaller",
                      "com.android.vending",
                      "com.google.android.gms",
                      "com.google.android.apps.walletnfcrel",
                      "com.google.android.apps.nbu.paisa.user",
                      "com.google.android.apps.authenticator2",
                      "com.nu.production",
                      "com.itau",
                      "com.bradesco",
                      "br.com.bb.android",
                      "com.mercadopago.wallet",
                      "com.picpay",
                      "com.paypal.android.p2pmobile"
                  )
              }

              class Act(
                  val swipe: Boolean,
                  val a: TextView,
                  val b: TextView?,
                  var customDelay: Long = -1L,
                  var customDuration: Long = -1L
              )

              class MacroStep(val path: Path, val duration: Long, var delayAfter: Long = 500L)

              private lateinit var wm: WindowManager
              private val handler = Handler(Looper.getMainLooper())
              private val acts = ArrayList<Act>()
              private val macroSteps = ArrayList<MacroStep>()

              private var panel: View? = null
              private var panelLp: WindowManager.LayoutParams? = null
              private var playBtn: TextView? = null
              private var recBtn: TextView? = null
          private var recordingOverlay: View? = null
          private var recLp: WindowManager.LayoutParams? = null

              private var running = false
              private var recording = false
              private var runGen = 0
              private var idx = 0
              private var cycles = 0
              private var runStart = 0L

              private var sensorManager: SensorManager? = null
              private var accelerometer: Sensor? = null
              private var shakeOn = false
              private var lastShakeTime = 0L
              private var currentPkg = ""
              private var receiverOn = false

              private val screenReceiver = object : BroadcastReceiver() {
                  override fun onReceive(c: Context?, i: Intent?) {
                      if (running || recording) {
                          stopRun()
                          stopRecording()
                          toast("🔒 Tela desligada: auto clicker parado")
                      }
                  }
              }

              private fun dp(v: Int) = (v * resources.displayMetrics.density).toInt()
              private fun markerSize() = dp(52)

              override fun onServiceConnected() {
                  super.onServiceConnected()
                  instance = this
                  wm = getSystemService(Context.WINDOW_SERVICE) as WindowManager

                  sensorManager = getSystemService(Context.SENSOR_SERVICE) as SensorManager
                  accelerometer = sensorManager?.getDefaultSensor(Sensor.TYPE_ACCELEROMETER)

                  if (!receiverOn) {
                      registerReceiver(screenReceiver, IntentFilter(Intent.ACTION_SCREEN_OFF))
                      receiverOn = true
                  }
              }

              // Sensor só fica ligado enquanto algo está rodando (economiza bateria)
              private fun enableShake() {
                  if (shakeOn) return
                  accelerometer?.let {
                      sensorManager?.registerListener(this, it, SensorManager.SENSOR_DELAY_UI)
                      shakeOn = true
                  }
              }

              private fun disableShake() {
                  if (!shakeOn) return
                  sensorManager?.unregisterListener(this)
                  shakeOn = false
              }

              override fun onSensorChanged(event: SensorEvent?) {
                  if (event == null) return
                  val x = event.values[0] / 9.80665
                  val y = event.values[1] / 9.80665
                  val z = event.values[2] / 9.80665
                  val gForce = sqrt(x * x + y * y + z * z)

                  if (gForce > 2.7) {
                      val now = System.currentTimeMillis()
                      if (now - lastShakeTime > 1500) {
                          lastShakeTime = now
                          if (running || recording) {
                              stopRun()
                              stopRecording()
                              toast("🛡️ Parada de Emergência: Agitação detectada!")
                              buzz(200)
                          }
                      }
                  }
              }

              override fun onAccuracyChanged(sensor: Sensor?, accuracy: Int) {}

              private fun isBlocked(pkg: String): Boolean {
                  if (Prefs.get(this, "safeMode") != 1L) return false
                  if (pkg.isEmpty()) return false
                  return pkg in BLOCKED || pkg.contains("bank") || pkg.contains("banco") || pkg.contains("wallet")
              }

              override fun onAccessibilityEvent(event: AccessibilityEvent?) {
                  if (event == null || event.eventType != AccessibilityEvent.TYPE_WINDOW_STATE_CHANGED) return
                  val pkg = event.packageName?.toString() ?: return
                  if (pkg == packageName) return
                  currentPkg = pkg
                  if (running && isBlocked(pkg)) {
                      stopRun()
                      toast("🛡️ Modo seguro: app sensível detectado, parado")
                      buzz(200)
                  }
              }

              override fun onInterrupt() {
                  stopRun()
                  stopRecording()
              }

              private fun cleanup() {
                  closeAll()
                  disableShake()
                  if (receiverOn) {
                      try { unregisterReceiver(screenReceiver) } catch (_: Exception) {}
                      receiverOn = false
                  }
                  instance = null
              }

              override fun onUnbind(intent: Intent?): Boolean {
                  cleanup()
                  return super.onUnbind(intent)
              }

              override fun onDestroy() {
                  cleanup()
                  super.onDestroy()
              }

              @Suppress("DEPRECATION")
              private fun buzz(ms: Long) {
                  try {
                      if (Prefs.get(this, "vibrate") == 1L) {
                          (getSystemService(Context.VIBRATOR_SERVICE) as Vibrator).vibrate(ms)
                      }
                  } catch (_: Exception) {}
              }

              private fun roundBtn(t: String, color: Int): TextView {
                  val v = TextView(this)
                  v.text = t
                  v.textSize = 16f * scalePct() / 100f
                  v.setTextColor(Color.WHITE)
                  v.gravity = Gravity.CENTER
                  val bg = GradientDrawable()
                  bg.shape = GradientDrawable.OVAL
                  bg.setColor(color)
                  v.background = bg
                  val lp = LinearLayout.LayoutParams(dp(40) * scalePct() / 100, dp(40) * scalePct() / 100)
                  lp.setMargins(dp(3), 0, dp(3), 0)
                  v.layoutParams = lp
                  return v
              }

              fun showPanel() {
                  if (panel != null) return
                  val accent = Ui.accent(this)

                  val row = LinearLayout(this)
                  row.orientation = LinearLayout.HORIZONTAL
                  row.gravity = Gravity.CENTER_VERTICAL
                  val bg = GradientDrawable()
                  bg.setColor(Color.argb(245, 18, 22, 29))
                  bg.cornerRadius = dp(30).toFloat()
                  bg.setStroke(dp(1), Color.argb(255, 48, 56, 70))
                  row.background = bg
                  row.setPadding(dp(8), dp(6), dp(8), dp(6))
                  row.alpha = Prefs.get(this, "panelAlpha").toInt() / 100f

                  val lp = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                          WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS or
                          WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN,
                      PixelFormat.TRANSLUCENT
                  )
                  lp.gravity = Gravity.TOP or Gravity.START
                  val sx = Prefs.getRaw(this, "panelX", -1L)
                  val sy = Prefs.getRaw(this, "panelY", -1L)
                  val dmp = resources.displayMetrics
                  lp.x = if (sx >= 0) sx.toInt().coerceIn(0, dmp.widthPixels - dp(60)) else dp(16)
                  lp.y = if (sy >= 0) sy.toInt().coerceIn(0, dmp.heightPixels - dp(100)) else dp(200)
                  // posição inicial definida acima

                  val handle = roundBtn("☰", Color.rgb(48, 56, 70))
                  var downX = 0f
                  var downY = 0f
                  var startX = 0
                  var startY = 0
          handle.setOnTouchListener { _, e ->
              when (e.action) {
                  MotionEvent.ACTION_DOWN -> {
                      downX = e.rawX
                      downY = e.rawY
                      startX = lp.x
                      startY = lp.y
                  }
                  MotionEvent.ACTION_MOVE -> {
                      lp.x = startX + (e.rawX - downX).toInt()
                      lp.y = startY + (e.rawY - downY).toInt()
                      try { wm.updateViewLayout(row, lp) } catch (_: Exception) {}
                  }
                  MotionEvent.ACTION_UP -> {
                      Prefs.setRaw(this, "panelX", lp.x.toLong().coerceAtLeast(0L))
                      Prefs.setRaw(this, "panelY", lp.y.toLong().coerceAtLeast(0L))
                  }
              }
              true
          }
                  row.addView(handle)

                  val play = roundBtn("▶", Color.rgb(46, 160, 90))
                  play.setOnClickListener { if (running) stopRun() else startRun() }
                  playBtn = play
                  row.addView(play)

                  val rec = roundBtn("⏺", Color.rgb(200, 60, 60))
                  rec.setOnClickListener { if (recording) stopRecording() else startRecording() }
                  recBtn = rec
                  row.addView(rec)

                  val tap = roundBtn("👆", accent)
                  tap.setOnClickListener { addTap() }
                  row.addView(tap)

                  val swipe = roundBtn("↔", accent)
                  swipe.setOnClickListener { addSwipe() }
                  row.addView(swipe)

                  val del = roundBtn("🗑", Color.rgb(48, 56, 70))
                  del.setOnClickListener { removeLast() }
                  del.setOnLongClickListener {
                      if (!running && !recording) {
                          clearAll()
                          macroSteps.clear()
                          toast("Todos os pontos e macros apagados")
                      }
                      true
                  }
                  row.addView(del)

                  val cfg = roundBtn("⚙", Color.rgb(48, 56, 70))
                  cfg.setOnClickListener {
                      val i = Intent(this, SettingsActivity::class.java)
                      i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                      startActivity(i)
                  }
                  row.addView(cfg)

                  val close = roundBtn("✕", Color.rgb(48, 56, 70))
                  close.setOnClickListener { closeAll() }
                  row.addView(close)

                  wm.addView(row, lp)
                  panel = row
                  panelLp = lp
              }

              fun isPanelOpen(): Boolean = panel != null

              fun closePanelFromUi() {
                  closeAll()
              }

              // Recria o painel para aplicar tamanho, opacidade, cor e posição novos
              fun refreshPanel() {
                  if (panel != null && !running && !recording) {
                      hidePanel()
                      showPanel()
                  }
              }

              private fun scalePct(): Int = Prefs.get(this, "panelScale").toInt()

              private fun hidePanel() {
                  panel?.let { try { wm.removeView(it) } catch (_: Exception) {} }
                  panel = null
                  panelLp = null
                  playBtn = null
                  recBtn = null
              }

              // Mantém o painel sempre acima da camada de gravação para poder parar
              private fun bringPanelToFront() {
                  val p = panel ?: return
                  val l = panelLp ?: return
                  try {
                      wm.removeView(p)
                      wm.addView(p, l)
                  } catch (_: Exception) {}
              }

              private fun closeAll() {
                  stopRun()
                  stopRecording()
                  clearAll()
                  hidePanel()
              }

              private fun toast(t: String) {
                  Toast.makeText(this, t, Toast.LENGTH_SHORT).show()
              }

              private fun makeMarker(label: String, color: Int, x: Int, y: Int): TextView {
                  val size = markerSize()
                  val m = TextView(this)
                  m.text = label
                  m.setTextColor(Color.WHITE)
                  m.textSize = 15f
                  m.typeface = Typeface.DEFAULT_BOLD
                  m.gravity = Gravity.CENTER
                  val bg = GradientDrawable()
                  bg.shape = GradientDrawable.OVAL
                  bg.setColor(Color.argb(200, Color.red(color), Color.green(color), Color.blue(color)))
                  bg.setStroke(dp(3), Color.WHITE)
                  m.background = bg
                  m.alpha = 0.92f

                  val lp = WindowManager.LayoutParams(
                      size, size,
                      WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                          WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS or
                          WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN,
                      PixelFormat.TRANSLUCENT
                  )
                  lp.gravity = Gravity.TOP or Gravity.START
                  lp.x = x
                  lp.y = y
                  m.tag = lp

                  var downX = 0f
                  var downY = 0f
                  var startX = 0
                  var startY = 0
          var lastTap = 0L
          m.setOnTouchListener { _, e ->
              when (e.action) {
                  MotionEvent.ACTION_DOWN -> {
                      downX = e.rawX
                      downY = e.rawY
                      startX = lp.x
                      startY = lp.y
                  }
                  MotionEvent.ACTION_MOVE -> {
                      lp.x = startX + (e.rawX - downX).toInt()
                      lp.y = startY + (e.rawY - downY).toInt()
                      try { wm.updateViewLayout(m, lp) } catch (_: Exception) {}
                  }
                  MotionEvent.ACTION_UP -> {
                      // Toque duplo (sem arrastar) abre as configurações deste botão
                      val moved = abs(e.rawX - downX) > dp(8) || abs(e.rawY - downY) > dp(8)
                      if (!moved && !running && !recording) {
                          val now = SystemClock.elapsedRealtime()
                          if (now - lastTap < 400) {
                              lastTap = 0L
                              val i = acts.indexOfFirst { it.a === m || it.b === m }
                              if (i >= 0) openConfig(i)
                          } else {
                              lastTap = now
                          }
                      }
                  }
              }
              true
          }
          wm.addView(m, lp)
                  return m
              }

              private fun lpOf(v: View): WindowManager.LayoutParams = v.tag as WindowManager.LayoutParams

              private fun addTap() {
                  if (running || recording) {
                      toast("Pare a execução ou gravação primeiro")
                      return
                  }
                  val n = acts.size + 1
                  val dm = resources.displayMetrics
                  val size = markerSize()
                  val off = (n % 5) * dp(20)
                  val x = dm.widthPixels / 2 - size / 2 + off
                  val y = dm.heightPixels / 2 - size / 2 + off
                  val m = makeMarker(n.toString(), Color.rgb(33, 150, 243), x, y)
                  acts.add(Act(false, m, null))
              }

              private fun addSwipe() {
                  if (running || recording) {
                      toast("Pare a execução ou gravação primeiro")
                      return
                  }
                  val n = acts.size + 1
                  val dm = resources.displayMetrics
                  val size = markerSize()
                  val x = dm.widthPixels / 2 - size / 2
                  val y = dm.heightPixels / 2 - size / 2
                  val a = makeMarker(n.toString() + "A", Color.rgb(76, 175, 80), x, y - dp(100))
                  val b = makeMarker(n.toString() + "B", Color.rgb(244, 67, 54), x, y + dp(100))
                  acts.add(Act(true, a, b))
              }

              private fun removeLast() {
                  if (running || recording) return
                  if (acts.isEmpty()) return
                  val last = acts.removeAt(acts.size - 1)
                  try { wm.removeView(last.a) } catch (_: Exception) {}
                  last.b?.let { try { wm.removeView(it) } catch (_: Exception) {} }
              }

              private fun clearAll() {
                  for (a in acts) {
                      try { wm.removeView(a.a) } catch (_: Exception) {}
                      a.b?.let { try { wm.removeView(it) } catch (_: Exception) {} }
                  }
                  acts.clear()
              }

          private fun startRecording() {
              if (running) return
              if (isBlocked(currentPkg)) {
                  toast("🛡️ Modo seguro: gravação bloqueada neste app")
                  return
              }
              clearAll()
              macroSteps.clear()
              recording = true
              enableShake()
              recBtn?.text = "⏹"
              toast("Gravando! Use a tela normalmente: o movimento acontece assim que você soltar o dedo.")

              val lp = WindowManager.LayoutParams(
                  WindowManager.LayoutParams.MATCH_PARENT,
                  WindowManager.LayoutParams.MATCH_PARENT,
                  WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
                  WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                      WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS or
                      WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN,
                  PixelFormat.TRANSLUCENT
              )

              val overlay = View(this)
              overlay.setBackgroundColor(Color.argb(20, 255, 60, 60))
              var startTime = 0L
              var lastUpTime = 0L
              val currentPath = Path()

              overlay.setOnTouchListener { _, e ->
                  val now = System.currentTimeMillis()
                  when (e.action) {
                      MotionEvent.ACTION_DOWN -> {
                          startTime = now
                          // Tempo de espera real entre o fim do gesto anterior e este
                          if (macroSteps.isNotEmpty() && lastUpTime > 0L) {
                              macroSteps[macroSteps.size - 1].delayAfter = (now - lastUpTime).coerceAtLeast(10L)
                          }
                          currentPath.reset()
                          currentPath.moveTo(e.rawX, e.rawY)
                      }
                      MotionEvent.ACTION_MOVE -> {
                          currentPath.lineTo(e.rawX, e.rawY)
                      }
                      MotionEvent.ACTION_UP -> {
                          val touchDuration = (now - startTime).coerceAtLeast(20L)
                          lastUpTime = now
                          macroSteps.add(MacroStep(Path(currentPath), touchDuration))
                          // Repete o gesto na tela para o app por baixo reagir
                          replayLive(Path(currentPath), touchDuration)
                      }
                      MotionEvent.ACTION_CANCEL -> {
                          val touchDuration = (now - startTime).coerceAtLeast(20L)
                          lastUpTime = now
                          macroSteps.add(MacroStep(Path(currentPath), touchDuration))
                      }
                  }
                  true
              }

              recLp = lp
              wm.addView(overlay, lp)
              recordingOverlay = overlay
              bringPanelToFront()
          }

          // Deixa a camada de gravação "transparente ao toque" para o gesto repetido chegar no app
          private fun setRecordingTouchable(on: Boolean) {
              val v = recordingOverlay ?: return
              val l = recLp ?: return
              l.flags = if (on) {
                  l.flags and WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE.inv()
              } else {
                  l.flags or WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE
              }
              try { wm.updateViewLayout(v, l) } catch (_: Exception) {}
          }

          private fun replayLive(path: Path, duration: Long) {
              setRecordingTouchable(false)
              val d = duration.coerceIn(1L, GestureDescription.getMaxGestureDuration())
              val gesture = GestureDescription.Builder()
                  .addStroke(GestureDescription.StrokeDescription(path, 0, d))
                  .build()
              val ok = dispatchGesture(gesture, object : GestureResultCallback() {
                  override fun onCompleted(g: GestureDescription?) { setRecordingTouchable(true) }
                  override fun onCancelled(g: GestureDescription?) { setRecordingTouchable(true) }
              }, null)
              if (!ok) setRecordingTouchable(true)
          }

          private fun openConfig(i: Int) {
              val cfg = Intent(this, ClickConfigActivity::class.java)
              cfg.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
              cfg.putExtra("index", i)
              try { startActivity(cfg) } catch (_: Exception) {}
          }

          fun getActInfo(i: Int): LongArray? {
              val a = acts.getOrNull(i) ?: return null
              return longArrayOf(a.customDelay, a.customDuration, if (a.swipe) 1L else 0L)
          }

          private fun fmtMs(ms: Long): String {
              val h = ms / 3600000L
              val m = (ms % 3600000L) / 60000L
              val s = (ms % 60000L) / 1000L
              val r = ms % 1000L
              return "${h}h ${m}min ${s}s ${r}ms"
          }

          fun setActCustom(i: Int, delay: Long, duration: Long) {
              val a = acts.getOrNull(i) ?: return
              a.customDelay = delay
              a.customDuration = duration
              if (delay < 0) {
                  toast("Botão " + (i + 1) + ": usando o padrão")
              } else {
                  toast("Botão " + (i + 1) + ": atraso " + fmtMs(delay))
              }
          }

              private fun stopRecording() {
                  if (!recording) return
                  recording = false
                  recBtn?.text = "⏺"
                  recordingOverlay?.let { try { wm.removeView(it) } catch (_: Exception) {} }
                  recordingOverlay = null
                  recLp = null
                  if (!running) disableShake()
                  toast("Gravação salva! (${macroSteps.size} gestos gravados)")
              }

              private fun setMarkersRunning(on: Boolean) {
                  for (a in acts) {
                      for (v in listOfNotNull(a.a, a.b)) {
                          val lp = lpOf(v)
                          if (on) {
                              lp.flags = lp.flags or WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE
                              v.alpha = 0.25f
                          } else {
                              lp.flags = lp.flags and WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE.inv()
                              v.alpha = 0.92f
                          }
                          try { wm.updateViewLayout(v, lp) } catch (_: Exception) {}
                      }
                  }
              }

              private fun startRun() {
                  if (recording) {
                      toast("Pare a gravação primeiro")
                      return
                  }
                  if (acts.isEmpty() && macroSteps.isEmpty()) {
                      toast("Adicione pontos ou grave movimentos primeiro!")
                      return
                  }
                  if (isBlocked(currentPkg)) {
                      toast("🛡️ Modo seguro: bloqueado neste app")
                      return
                  }
                  runGen++
                  running = true
                  idx = 0
                  cycles = 0
                  runStart = SystemClock.elapsedRealtime()
                  enableShake()
                  buzz(40)
                  playBtn?.text = "⏸"
                  setMarkersRunning(true)
                  handler.postDelayed({ step() }, Prefs.get(this, "startDelay"))
              }

              private fun stopRun() {
                  running = false
                  runGen++
                  handler.removeCallbacksAndMessages(null)
                  playBtn?.text = "▶"
                  setMarkersRunning(false)
                  if (!recording) disableShake()
              }

              private fun step() {
                  if (!running) return

                  // Limite de tempo de segurança
                  val maxMin = Prefs.get(this, "maxMinutes")
                  if (maxMin > 0 && SystemClock.elapsedRealtime() - runStart > maxMin * 60_000L) {
                      stopRun()
                      toast("⏱ Tempo máximo de execução atingido")
                      buzz(200)
                      return
                  }

                  if (macroSteps.isNotEmpty()) {
                      if (idx >= macroSteps.size) {
                          idx = 0
                          cycles++
                          val maxRep = Prefs.get(this, "repeats")
                          if (maxRep > 0 && cycles >= maxRep) {
                              stopRun()
                              toast("Macro concluída!")
                              return
                          }
                      }
                      val stepItem = macroSteps[idx]
                      idx++
                      val gen = runGen

                      val gesture = GestureDescription.Builder()
                          .addStroke(GestureDescription.StrokeDescription(stepItem.path, 0, stepItem.duration))
                          .build()

                      dispatchGesture(gesture, object : GestureResultCallback() {
                          override fun onCompleted(g: GestureDescription?) { nextMacro(gen, stepItem.delayAfter) }
                          override fun onCancelled(g: GestureDescription?) { nextMacro(gen, stepItem.delayAfter) }
                      }, null)
                      return
                  }

                  if (acts.isEmpty()) {
                      stopRun()
                      return
                  }
                  if (idx >= acts.size) {
                      idx = 0
                      cycles++
                      val maxRep = Prefs.get(this, "repeats")
                      if (maxRep > 0 && cycles >= maxRep) {
                          stopRun()
                          toast("Ciclo concluído!")
                          return
                      }
                  }
                  val act = acts[idx]
                  idx++
                  val gen = runGen

                  val dm = resources.displayMetrics
                  val maxX = (dm.widthPixels - 1).toFloat()
                  val maxY = (dm.heightPixels - 1).toFloat()

                  val c1 = centerOf(act.a)
                  val path = Path()
                  val jitVal = Prefs.get(this, "jitter").toInt()
                  val jX = if (jitVal > 0) Random.nextInt(-jitVal, jitVal + 1) else 0
                  val jY = if (jitVal > 0) Random.nextInt(-jitVal, jitVal + 1) else 0

                  path.moveTo((c1.first + jX).coerceIn(0f, maxX), (c1.second + jY).coerceIn(0f, maxY))
                  var dur = if (act.customDuration > 0) act.customDuration else if (act.swipe) Prefs.get(this, "swipeDur") else Prefs.get(this, "tapDur")

                  val endMarker = act.b
                  if (act.swipe && endMarker != null) {
                      val c2 = centerOf(endMarker)
                      path.lineTo((c2.first + jX).coerceIn(0f, maxX), (c2.second + jY).coerceIn(0f, maxY))
                  }
                  if (dur < 1) dur = 1

                  val gesture = GestureDescription.Builder()
                      .addStroke(GestureDescription.StrokeDescription(path, 0, dur))
                      .build()

                  dispatchGesture(gesture, object : GestureResultCallback() {
                      override fun onCompleted(g: GestureDescription?) { nextPoint(gen, act.customDelay) }
                      override fun onCancelled(g: GestureDescription?) { nextPoint(gen, act.customDelay) }
                  }, null)
              }

          private fun nextPoint(gen: Int, custom: Long = -1L) {
              if (gen == runGen && running) {
                  var d: Long
                  if (custom >= 0) {
                      d = custom
                  } else {
                      d = Prefs.get(this, "interval")
                      val rnd = Prefs.get(this, "random")
                      if (rnd > 0) d += Random.nextLong(-rnd, rnd + 1)
                  }
                  if (d < 10) d = 10
                  handler.postDelayed({ step() }, d)
              }
          }

              private fun nextMacro(gen: Int, delay: Long) {
                  if (gen == runGen && running) {
                      handler.postDelayed({ step() }, delay.coerceAtLeast(10L))
                  }
              }

              private fun centerOf(v: View): Pair<Float, Float> {
                  val lp = lpOf(v)
                  val half = markerSize() / 2
                  return Pair((lp.x + half).toFloat(), (lp.y + half).toFloat())
              }
          }
          KT_EOF

      - name: Aceitar licencas do Android SDK
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compilar APK Assinado (Release)
        run: gradle assembleRelease --no-daemon --stacktrace
      - name: Publicar APK Confiável
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk AutoClickerPro-Trusted.apk
          sha256sum AutoClickerPro-Trusted.apk > AutoClickerPro-Trusted.sha256
          gh release create "v${{ github.run_number }}" AutoClickerPro-Trusted.apk AutoClickerPro-Trusted.sha256 \
            --title "Auto Clicker Pro v${{ github.run_number }} [Signed & Trusted]" \
            --notes "Versão assinada, otimizada com ProGuard, gravador de macros, shake-to-stop, limite de tempo, parada ao desligar a tela e bloqueio de apps sensíveis. Hash SHA-256 incluso para verificar a integridade."
